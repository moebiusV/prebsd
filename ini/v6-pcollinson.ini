; V6 (pcollinson/unixv6-extras) - three RK05 disks on a PDP-11/40.
; The extra devices (tm0/tm1 magtapes, rk3, ptr) are referenced by the kernel's
; device probes; simh creates them as empty files if they don't exist, which is
; what keeps the boot from panicking ("trap type 0").  Boot: `boot rk0`, then
; `unix` at the `@` prompt.
set cpu 11/40
set cpu idle
dep sr 173030
set tm0 writeenabled
set tm1 writeenabled
attach tm0 ../images/tm0.tap
attach tm1 ../images/tm1.tap
attach rk0 ../images/v6-rk0
attach rk1 ../images/v6-rk1
attach rk2 ../images/v6-rk2
attach rk3 ../images/rk3
attach ptr ../images/ptr
set console telnet=10023
boot rk0
