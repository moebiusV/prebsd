; TOPS-10 6.03 (Richard Cornwell's pre-built system) - four RP03 packs on a PDP-10 KI10.
; Made by pdp10/install-ki.sh.  The console (CTY) is on telnet 10025; user terminals
; are the DC lines on telnet 2022 (login [1,2] password FAILSA).
set cpu 512k idle
at dpa0 ../images/ki_dskb0.rp3
at dpa1 ../images/ki_dskb1.rp3
at dpa2 ../images/ki_dskb2.rp3
at dpa3 ../images/ki_dskb3.rp3
at lpt -n ../images/ki-lpt.log
set mta type=b
set dc modem=8
at dc 2022
set console telnet=10025
boot dpa
