; TOPS-10 6.03 (PiDP-10 / Richard Cornwell) - four RP03 packs on a PDP-10 KA10.
; The console (the operator's CTY) is on telnet 10024; user terminals are the DC
; lines on telnet 2021 (login [100,100] password demo1, or [1,2] FAILSA).
; The date is whatever the boot sequence in images.json types: 6.03 is not Y2K safe.
set cpu 256k idle
at dpa0 ../images/ka_dskb0.rp3
at dpa1 ../images/ka_dskb1.rp3
at dpa2 ../images/ka_dskb2.rp3
at dpa3 ../images/ka_dskb3.rp3
at lpt -n ../images/ka-lpt.log
set cr disable
set mta type=b
set dc modem=8
at dc 2021
set console telnet=10024
boot dpa
