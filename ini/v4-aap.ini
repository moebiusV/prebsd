; V4 (aap/squoze.net tape recovery) - one RK05 disk on a PDP-11/45.
; Boot: `boot rk` loads uboot from the RK0 boot sector, then `k` (select RK05),
; then `unix` (kernel), then `root` at `login:`.  disk.rk is the recovered tape's
; RK05 image; unix_v4.tap is only needed to re-install via install.ini.
set cpu 11/45
set tc en
attach rk0 ../images/disk.rk
d sr 2
set console telnet=10023
boot rk
