; V4 (aap/squoze.net tape recovery) - one RK05 disk on a PDP-11/45.
; Boot: `boot rk` loads uboot from the RK0 boot sector, then `k` (select RK05),
; then `unix` (kernel), then `root` at `login:`.  v4-rk05.disk is the recovered
; tape's RK05 image; v4-tape is only needed to re-install via install.ini.
set cpu 11/45
set tc en
attach rk0 ../images/v4-rk05.disk
d sr 2
set console telnet=10023
boot rk
