; V7 (Keith Bostic tape) - RP06, pure install.  Three-stage boot.
; boot rp0 -> hpuboot (block 0) silently waits -> type "boot" -> /boot prints
; "Boot:" -> type "hp(0,0)hptmunix".  The kernel is built for the 11/70.
set cpu 11/70
set cpu 2M
set cpu idle
set rp0 rp06
att rp0 ../images/v7-bostic.disk
set console telnet=10023
boot rp0
