; V7 (Keith Bostic tape) install — disk boot.
; Boots the installed root filesystem on the RP06.  The boot is three-stage:
;   boot rp0  -> hpuboot (block 0) silently waits for a pathname
;   boot      -> hpuboot loads /boot, the 2nd-stage boot program (prints "Boot:")
;   hp(0,0)hptmunix -> /boot loads the kernel
; The console is on telnet port 10025.  The kernel (hptmunix) is built for the
; 11/70 (HP = RP04/5/6 on the RH70), so the CPU is an 11/70 here — unlike the
; install (tboot.ini), which must be an 11/45 because the standalone TM11 tape
; driver breaks under the 11/70's Unibus map.
set cpu 11/70
set cpu 2M
set cpu idle
set rp0 rp06
att rp0 ../images/v7-bostic.disk
set console telnet=10025
boot rp0
