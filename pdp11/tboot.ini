; V7 (Keith Bostic tape) install — tape boot.
; Boots the standalone boot program from the distribution tape so mkfs/restor
; can build a root filesystem on a blank RP06 disk.  The console is on telnet
; port 10025; installv7.py drives it headlessly.
;
; The CPU is an 11/45, not an 11/70: on the 11/70 the V7 standalone tape driver
; fails (the Unibus map is not set up for the TM11 at 172520), and every tape
; read comes back as zeros.  This matches the gunkies.org recipe.
set cpu 11/45
set cpu idle
set rp0 rp06
att rp0 ../images/v7-bostic.disk
att tm0 ../images/v7-bostic.tap
set console telnet=10025
boot tm0
